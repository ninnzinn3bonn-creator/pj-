name: Team sharing checks
on:
  push:
    paths: ['team-worker/**', 'lib/architecture-schema.js', 'public/**', '.github/workflows/team.yml']
  pull_request:
    paths: ['team-worker/**', 'lib/architecture-schema.js', 'public/**', '.github/workflows/team.yml']
permissions:
  contents: read
jobs:
  team:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: team-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run deploy:check
